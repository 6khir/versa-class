<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERSA CLASS Book Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --white:        #ffffff;
            --sky:          #4ea9f0;
            --sky-bright:   #7cc4ff;
            --royal:        #1b46c2;
            --royal-deep:   #12276e;
            --bg-0:         #050609;
            --bg-1:         #0a0c11;
            --glass-fill:   rgba(20, 26, 36, 0.55);
            --glass-fill-2: rgba(14, 18, 26, 0.42);
            --glass-brd:    rgba(126, 178, 240, 0.14);
            --glass-brd-hi: rgba(126, 178, 240, 0.32);
            --tx-hi:        #eef4ff;
            --tx-mid:       #9fb0c8;
            --tx-lo:        #5a6a83;
            --glow-sky:     0 0 0 1px rgba(78,169,240,0.35), 0 0 24px rgba(78,169,240,0.35), 0 0 64px rgba(78,169,240,0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, .stage, .glass-header, .glass-row, .prompt, .glass-input, .glass-select {
            transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        html, body {
            height: 100%;
            background: var(--bg-0);
            color: var(--tx-hi);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }
        html[data-theme="light"] {
            --bg-0: #F4F6F9;
            --bg-1: #EEF1F5;
            --glass-fill: rgba(255, 255, 255, 0.86);
            --glass-fill-2: rgba(255, 255, 255, 0.72);
            --glass-brd: rgba(20, 32, 48, 0.08);
            --glass-brd-hi: rgba(20, 32, 48, 0.14);
            --tx-hi: #141B26;
            --tx-mid: #5A6573;
            --tx-lo: #8A93A0;
        }
        .stage {
            position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; isolation: isolate;
        }
        .stage::before, .stage::after {
            content: ""; position: absolute; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.5; animation: drift 22s ease-in-out infinite alternate;
        }
        .stage::before {
            width: 640px; height: 640px; left: 10%; top: -10%; background: radial-gradient(circle at 50% 50%, var(--sky) 0%, transparent 70%);
        }
        .stage::after {
            width: 560px; height: 560px; right: 10%; bottom: -10%; background: radial-gradient(circle at 50% 50%, var(--royal) 0%, transparent 70%); animation-delay: -6s; opacity: 0.4;
        }
        @keyframes drift {
            0%   { transform: translate3d(0,0,0) scale(1); }
            100% { transform: translate3d(40px,30px,0) scale(1.12); }
        }
        .stage-grid {
            position: absolute; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(126,178,240,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(126,178,240,0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 80%);
        }
        .glass-header {
            background: var(--glass-fill); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); border-bottom: 1px solid var(--glass-brd); z-index: 50;
        }
        .prompt {
            display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 999px;
            background: var(--glass-fill-2); backdrop-filter: blur(30px) saturate(160%); border: 1px solid var(--glass-brd-hi); transition: box-shadow .25s ease, border-color .25s ease;
        }
        .prompt:focus-within { border-color: var(--sky); box-shadow: var(--glow-sky); }
        .prompt input { flex: 1; background: transparent; border: none; outline: none; color: var(--tx-hi); font-size: 14px; width: 300px; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 24px; }
        .content-scroll::-webkit-scrollbar { width: 8px; }
        .content-scroll::-webkit-scrollbar-thumb { background: rgba(126,178,240,0.18); border-radius: 999px; }
        .glass-row {
            background: var(--glass-fill-2); backdrop-filter: blur(24px) saturate(150%); border: 1px solid var(--glass-brd);
            box-shadow: 0 18px 44px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03); border-radius: 16px; transition: transform .22s ease, border-color .22s ease;
        }
        .glass-row:hover { transform: translateY(-2px); border-color: var(--glass-brd-hi); background: var(--glass-fill); }
        .glass-input, .glass-select {
            background: rgba(126,178,240,0.05); border: 1px solid var(--glass-brd); border-radius: 8px; color: var(--tx-hi); transition: all 0.2s;
        }
        .glass-input:focus, .glass-select:focus { border-color: var(--sky-bright); background: rgba(78,169,240,0.1); outline: none; box-shadow: 0 0 12px rgba(78,169,240,0.2); }
        .glass-select option { background: var(--bg-1); color: var(--tx-hi); }
        
        .gen-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            background: linear-gradient(135deg, var(--sky-bright), var(--royal)); color: var(--white); font-size: 13px; font-weight: 600; cursor: pointer; transition: transform .16s ease;
        }
        .gen-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(78,169,240,0.5); }
        
        .smm-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(168,85,247,0.3); border-radius: 8px;
            background: rgba(168,85,247,0.1); color: #c084fc; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .16s;
        }
        .smm-btn:hover { background: rgba(168,85,247,0.2); border-color: #c084fc; box-shadow: 0 0 15px rgba(168,85,247,0.2); }

        .eyebrow {
            display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--sky); font-weight: 700;
            padding: 4px 12px; border-radius: 999px; background: rgba(78,169,240,0.08); border: 1px solid var(--glass-brd);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sky-bright); box-shadow: 0 0 10px var(--sky); animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
        /* Dropdown custom styles */
        select.glass-select { appearance: none; -webkit-appearance: none; padding-right: 24px; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239fb0c8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E"); background-position: right 8px center; background-repeat: no-repeat; }
    </style>
</head>
<body>
    <div id="app" class="stage">
        <div class="stage-grid"></div>
        <header class="glass-header px-8 py-4 flex justify-between items-center w-full">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white leading-none mb-1">VERSA CLASS</h1>
                    <div class="eyebrow"><span class="dot"></span> Book Management</div>
                </div>
            </div>
            <div class="prompt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width: 18px; color: var(--tx-lo);"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
                <input type="text" v-model="searchQuery" placeholder="Search by P001, name, or price..." />
            </div>
        </header>
        <main class="content-scroll w-full">
            <div class="max-w-[1400px] mx-auto w-full">
                <!-- Header: 12 Cols -->
                <div class="grid grid-cols-12 gap-3 px-6 py-3 mb-2 text-xs font-semibold uppercase tracking-[0.1em]" style="color: var(--tx-lo);">
                    <div class="col-span-1">ID</div>
                    <div class="col-span-4">Product Name</div>
                    <div class="col-span-2">Status</div>
                    <div class="col-span-1">Price</div>
                    <div class="col-span-1">Sales</div>
                    <div class="col-span-3 text-center">Engine Tools</div>
                </div>

                <div v-if="loading" class="flex justify-center items-center h-64" style="color: var(--sky);">
                    <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                </div>
                
                <div v-else class="flex flex-col gap-3 pb-20">
                    <div v-for="product in filteredProducts" :key="product.id" class="glass-row px-6 py-4 grid grid-cols-12 items-center gap-3">
                        <div class="col-span-1 flex items-center">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold" style="background: rgba(126,178,240,0.12); color: var(--sky);">
                                {{ product.product_id }}
                            </span>
                        </div>
                        
                        <!-- Editable Product Name -->
                        <div class="col-span-4 pr-2">
                            <input type="text" v-model="product.name" @change="updateNotion(product, 'Product Name', product.name, 'rich_text')" 
                                   class="glass-input w-full px-3 py-1.5 font-semibold text-sm" placeholder="Unnamed Product" :title="product.name">
                        </div>
                        
                        <div class="col-span-2 pr-2">
                            <select v-model="product.status" @change="updateNotion(product, 'Status', product.status, 'select')" 
                                    class="glass-select w-full px-3 py-1.5 font-semibold text-xs rounded-lg"
                                    :style="product.status === 'Published' ? 'color: #86efac; border-color: rgba(134,239,172,0.3)' : 'color: #9fb0c8;'">
                                <option value="Published">Published</option>
                                <option value="Not Published">Not Published</option>
                            </select>
                        </div>
                        <div class="col-span-1">
                            <div class="relative w-full">
                                <span class="absolute left-2 top-1.5 text-xs font-medium" style="color: var(--tx-mid);">$</span>
                                <input type="number" v-model="product.price" @change="updateNotion(product, 'Price', product.price, 'number')" 
                                       class="glass-input w-full pl-6 pr-2 py-1.5 font-bold text-xs text-center">
                            </div>
                        </div>
                        <div class="col-span-1">
                            <div class="relative w-full">
                                <input type="number" v-model="product.sales" @change="updateNotion(product, 'Sales', product.sales, 'number')" 
                                       class="glass-input w-full px-2 py-1.5 font-bold text-xs text-center" placeholder="0">
                            </div>
                        </div>
                        <div class="col-span-3 flex items-center justify-end gap-2">
                            <button @click="openFolder(product.book_url)" class="gen-btn flex-1 py-1.5">
                                <i class="fas fa-folder-open"></i> Book
                            </button>
                            <button @click="openFolder(product.smm_url)" class="smm-btn flex-1 py-1.5">
                                <i class="fas fa-folder"></i> SMM
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        createApp({
            setup() {
                const products = ref([]);
                const loading = ref(true);
                const searchQuery = ref('');

                const fetchProducts = async () => {
                    loading.value = true;
                    try {
                        const response = await fetch('/api/integration/books');
                        const json = await response.json();
                        const rows = Array.isArray(json.books) ? json.books : (Array.isArray(json) ? json : []);
                        products.value = rows.map((book) => ({
                            id: book.page_id || book.product_id,
                            product_id: book.product_id,
                            name: book.name || '',
                            status: book.status || 'Not Published',
                            price: book.price || 0,
                            sales: book.sales || 0,
                            book_url: book.book_path ? `tpt://${book.book_path}` : (book.book_url || ''),
                            smm_url: book.smm_path ? `tpt://${book.smm_path}` : (book.smm_url || '')
                        }));
                    } catch (error) { console.error(error); }
                    loading.value = false;
                };

                const updateNotion = async (product, field, value, type='number') => {
                    try {
                        let finalVal = value;
                        if(type === 'number') { finalVal = parseFloat(value) || 0; }
                        await fetch('/api/update', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ page_id: product.id, field: field, value: finalVal, type: type })
                        });
                    } catch (error) { console.error(error); }
                };

                const openFolder = async (url) => {
                    if (!url) return;
                    await fetch('/api/open', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                };

                const filteredProducts = computed(() => {
                    if (!searchQuery.value) return products.value;
                    const query = searchQuery.value.toLowerCase();
                    return products.value.filter(p => 
                        (p.product_id && p.product_id.toLowerCase().includes(query)) ||
                        (p.name && p.name.toLowerCase().includes(query)) ||
                        (p.status && p.status.toLowerCase().includes(query))
                    );
                });

                const applyHostTheme = (theme) => {
                    const next = theme === 'light' ? 'light' : 'dark';
                    document.documentElement.dataset.theme = next;
                    document.documentElement.style.colorScheme = next;
                };
                const readTheme = () => new URLSearchParams(location.search).get('theme') || 'dark';

                onMounted(() => {
                    applyHostTheme(readTheme());
                    window.addEventListener('message', (event) => {
                        if (event.data?.type === 'versa-theme') applyHostTheme(event.data.theme);
                    });
                    fetchProducts();
                });
                return { products, loading, searchQuery, filteredProducts, updateNotion, openFolder };
            }
        }).mount('#app');
    </script>
</body>
</html>
